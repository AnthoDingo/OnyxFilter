# Publication d'une version : pousser un tag « vMAJEUR.MINEUR.CORRECTIF » (ex. v1.4.0, ou v1.5.0-beta.1
# pour une préversion) construit l'archive autonome linux-x64 et crée la publication GitHub que suit le
# système de mise à jour intégré (src/OnyxFilter/Services/Updates).
name: Publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Lire la version du tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag invalide « $TAG » : attendu vMAJEUR.MINEUR.CORRECTIF[-préversion]."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier OnyxFilter (linux-x64, autonome)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/OnyxFilter/OnyxFilter.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:Version="$VERSION" \
            --output dist/OnyxFilter
          rm -f dist/OnyxFilter/appsettings.Development.json
          cp deploy/onyxfilter.service deploy/install.sh dist/OnyxFilter/
          chmod +x dist/OnyxFilter/OnyxFilter dist/OnyxFilter/install.sh

      - name: Vérifier la version publiée
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ACTUAL="$(dist/OnyxFilter/OnyxFilter --version)"
          echo "$ACTUAL"
          [[ "$ACTUAL" == "OnyxFilter $VERSION" ]]

      - name: Créer l'archive et les empreintes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="OnyxFilter-${VERSION}-linux-x64.tar.gz"
          tar -C dist -czf "$ARCHIVE" OnyxFilter
          sha256sum "$ARCHIVE" > checksums.txt
          cat checksums.txt
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Créer la publication GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "$ARCHIVE" checksums.txt deploy/install.sh \
            --title "OnyxFilter $VERSION" \
            --generate-notes \
            "${FLAGS[@]}"
